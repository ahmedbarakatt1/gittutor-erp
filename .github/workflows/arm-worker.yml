name: Private worker on ARM
on:
  pull_request:
    paths:
      - '.github/workflows/arm-worker.yml'
      - 'deploy/arm-worker/**'
      - 'deploy/vercel-scanner/**'
      - 'src/worker/**'
      - 'src/server/providers/file-scan.ts'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the pinned native image
        run: |
          test "$(uname -m)" = aarch64
          docker buildx build --platform linux/arm64 --load -f deploy/arm-worker/Dockerfile -t git-tutor-arm:check .
          test "$(docker image inspect -f '{{.Architecture}}' git-tutor-arm:check)" = arm64
      - name: Scan synthetic files and run the worker on an isolated queue
        run: bash deploy/arm-worker/rehearse.sh
