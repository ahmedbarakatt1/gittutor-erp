name: Local application verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      financial_acceptance_revision:
        description: Full Git commit to run the four financial acceptance cases (leave blank for full verification)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}${{ inputs.financial_acceptance_revision && '-financial-acceptance' || '' }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ !inputs.financial_acceptance_revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4.2.2
      - run: python tools/verify-pack.py
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx tools/validate-evidence.ts fixtures/acceptance-cases.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec tsx tools/ci-native-database.ts
      - run: pnpm exec tsx tools/db-migrate.ts
      - run: pnpm exec tsx tools/db-seed.ts
      - run: pnpm supabase:start
      - run: pnpm exec tsx tools/supabase-local.ts migrate
      - run: pnpm exec tsx tools/supabase-local.ts seed
      - run: pnpm db:verify
      - name: Restore a synthetic unknown payout and its private evidence
        run: pnpm test:recovery:payout
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:e2e --grep-invert 'guided synthetic booking'
      - name: Verify the five-role guided booking on fresh synthetic fixtures
        env:
          DEMO_VERIFY: '1'
        run: |
          pnpm exec tsx --env-file=.env.local --conditions=react-server tools/prepare-demo.ts
          pnpm exec playwright test tests/e2e/guided-demo.spec.ts --project=desktop --workers=1
      - run: pnpm db:verify
      - run: pnpm build

  financial-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.financial_acceptance_revision != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      APP_ENV: test
      CI: 'true'
      SOURCE_REVISION: ${{ inputs.financial_acceptance_revision }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ inputs.financial_acceptance_revision }}
          persist-credentials: false
      - run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.sha }}
          path: .local/evidence-instrumentation
          sparse-checkout: tools/evidence
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm supabase:start
      - run: pnpm exec tsx tools/supabase-local.ts migrate
      - run: pnpm exec tsx tools/supabase-local.ts seed
      - name: Record executed cases
        id: capture
        run: |
          mkdir -p tools/evidence
          cp .local/evidence-instrumentation/tools/evidence/{financial.config.ts,count-assertions.ts,record-financial.mjs} tools/evidence/
          node tools/evidence/record-financial.mjs . "$SOURCE_REVISION"
      - name: Retain the sanitized run report
        if: ${{ !cancelled() && steps.capture.outputs.report != '' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: financial-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.capture.outputs.report }}
          if-no-files-found: error
