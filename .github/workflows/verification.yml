name: Local application verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4.2.2
      - run: python tools/verify-pack.py
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.22.1'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx tools/validate-evidence.ts fixtures/acceptance-cases.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec tsx tools/ci-native-database.ts
      - run: pnpm exec tsx tools/db-migrate.ts
      - run: pnpm exec tsx tools/db-seed.ts
      - run: pnpm supabase:start
      - run: pnpm exec tsx tools/supabase-local.ts migrate
      - run: pnpm exec tsx tools/supabase-local.ts seed
      - run: pnpm db:verify
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:e2e
      - run: pnpm db:verify
      - run: pnpm build
