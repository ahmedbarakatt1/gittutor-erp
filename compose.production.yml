# Supply immutable images built from the same reviewed commit and a private runtime env file.
# TLS ingress and the private scanner are provided by the selected production host.
services:
  web:
    image: ${GIT_TUTOR_WEB_IMAGE:?Set the reviewed immutable web image}
    env_file: ${GIT_TUTOR_ENV_FILE:?Set an absolute path to the private runtime settings}
    environment:
      APP_ENV: production
    expose: ["3000"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0750
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 120s
  worker:
    image: ${GIT_TUTOR_WORKER_IMAGE:?Set the matching reviewed immutable worker image}
    env_file: ${GIT_TUTOR_ENV_FILE:?Set an absolute path to the private runtime settings}
    environment:
      APP_ENV: production
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 120s
